name: Release

# A human-pushed tag can still invoke this workflow directly. The gated
# version-bump bridge calls it as a reusable workflow because tags pushed with
# GITHUB_TOKEN do not trigger a second workflow.

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      release_ref:
        description: Commit or tag to build
        required: true
        type: string
      tag_name:
        description: Existing v-prefixed release tag
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RELEASE_REF: ${{ inputs.release_ref || github.ref }}
  RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Match Cargo manifests and release tag
        run: python scripts/release_version.py --expected-tag "$RELEASE_TAG"

  build:
    needs: validate
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: coval-linux-x64
            binary: coval
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: coval-linux-arm64
            binary: coval
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: coval-macos-x64
            binary: coval
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: coval-macos-arm64
            binary: coval
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: coval-windows-x64
            binary: coval.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../${{ matrix.artifact }}.tar.gz ${{ matrix.binary }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          for dir in */; do
            (cd "$dir" && sha256sum -- *.tar.gz > SHA256SUMS)
          done
          cat -- */SHA256SUMS > ../SHA256SUMS

      - name: Create or update release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.RELEASE_REF }}
          files: |
            artifacts/*/*.tar.gz
            SHA256SUMS
          generate_release_notes: true

  update-homebrew:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download SHA256SUMS from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS

      - name: Parse checksums
        id: sha
        run: |
          {
            echo "macos_arm64=$(grep 'coval-macos-arm64' SHA256SUMS | awk '{print $1}')"
            echo "macos_x64=$(grep 'coval-macos-x64' SHA256SUMS | awk '{print $1}')"
            echo "linux_arm64=$(grep 'coval-linux-arm64' SHA256SUMS | awk '{print $1}')"
            echo "linux_x64=$(grep 'coval-linux-x64' SHA256SUMS | awk '{print $1}')"
          } >> "$GITHUB_OUTPUT"

      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ env.RELEASE_TAG }}
          SHA_MACOS_ARM64: ${{ steps.sha.outputs.macos_arm64 }}
          SHA_MACOS_X64: ${{ steps.sha.outputs.macos_x64 }}
          SHA_LINUX_ARM64: ${{ steps.sha.outputs.linux_arm64 }}
          SHA_LINUX_X64: ${{ steps.sha.outputs.linux_x64 }}
        run: |
          set -euo pipefail
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not configured."
            exit 1
          fi

          tap_dir="${RUNNER_TEMP}/homebrew-tap"
          auth_header="Authorization: Basic $(printf 'x-access-token:%s' "$HOMEBREW_TAP_TOKEN" | base64 | tr -d '\n')"
          git_auth() {
            GIT_CONFIG_COUNT=1 \
              GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
              GIT_CONFIG_VALUE_0="$auth_header" \
              git "$@"
          }

          git_auth clone "https://github.com/coval-ai/homebrew-tap.git" "$tap_dir"
          mkdir -p "$tap_dir/Formula"
          python scripts/render_homebrew_formula.py \
            --version "${VERSION#v}" \
            --macos-arm64 "$SHA_MACOS_ARM64" \
            --macos-x64 "$SHA_MACOS_X64" \
            --linux-arm64 "$SHA_LINUX_ARM64" \
            --linux-x64 "$SHA_LINUX_X64" \
            --output "$tap_dir/Formula/coval.rb"

          if [ -z "$(git -C "$tap_dir" status --porcelain -- Formula/coval.rb)" ]; then
            echo "Homebrew formula already matches ${VERSION}; nothing to push."
            exit 0
          fi

          git -C "$tap_dir" config user.name "github-actions[bot]"
          git -C "$tap_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$tap_dir" add Formula/coval.rb
          git -C "$tap_dir" commit -m "chore: update coval to ${VERSION#v}"
          for attempt in 1 2 3; do
            if git_auth -C "$tap_dir" push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              break
            fi
            echo "Push attempt ${attempt} failed; rebasing on origin/main."
            git_auth -C "$tap_dir" fetch origin main
            git -C "$tap_dir" rebase origin/main
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the Homebrew formula update after 3 attempts."
          exit 1

  report-failure:
    needs: [validate, build, release, update-homebrew]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the release failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'CLI release workflow is failing';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Release \`${process.env.RELEASE_TAG}\` failed: ${runUrl}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

  close-recovered-failure:
    needs: [validate, build, release, update-homebrew]
    if: ${{ always() && needs.update-homebrew.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close a recovered release failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'CLI release workflow is failing';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Recovered in ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }
