name: Release

# A human-pushed tag can still invoke this workflow directly. The gated
# version-bump bridge calls it as a reusable workflow because tags pushed with
# GITHUB_TOKEN do not trigger a second workflow.

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      release_ref:
        description: Commit or tag to build
        required: true
        type: string
      tag_name:
        description: Existing v-prefixed release tag
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RELEASE_REF: ${{ inputs.release_ref || github.ref }}
  RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Holds HOMEBREW_TAP_TOKEN, so it never checks out repository code.
  verify-homebrew-token:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verify Homebrew publishing credential
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is missing or empty."
            exit 1
          fi
          if ! can_push="$(gh api repos/coval-ai/homebrew-tap --jq '.permissions.push // false')"; then
            echo "::error::HOMEBREW_TAP_TOKEN could not access coval-ai/homebrew-tap."
            exit 1
          fi
          if [ "$can_push" != "true" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN cannot push to coval-ai/homebrew-tap. Replace it with a token that has Contents and Pull requests read/write access."
            exit 1
          fi

          # The tap accepts changes only through pull requests. This request
          # names branches that do not exist, so it can never open one; GitHub
          # returns 422 only after authorizing the Pull requests write.
          probe_suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          probe_response="$RUNNER_TEMP/homebrew-tap-pull-probe.json"
          if ! pr_status="$(
            curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --output "$probe_response" \
              --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data "{\"title\":\"permission probe\",\"head\":\"__permission_probe_head_${probe_suffix}__\",\"base\":\"__permission_probe_base_${probe_suffix}__\"}" \
              https://api.github.com/repos/coval-ai/homebrew-tap/pulls
          )"; then
            echo "::error::Could not reach GitHub to check that HOMEBREW_TAP_TOKEN can open pull requests on coval-ai/homebrew-tap."
            exit 1
          fi
          if [ "$pr_status" != "422" ]; then
            message="$(jq -r '.message // empty' "$probe_response" 2>/dev/null || true)"
            echo "::error::HOMEBREW_TAP_TOKEN cannot open pull requests on coval-ai/homebrew-tap (HTTP ${pr_status}${message:+: $message}). Replace it with a token that has Contents and Pull requests read/write access."
            exit 1
          fi

  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Match Cargo manifests and release tag
        run: python scripts/release_version.py --expected-tag "$RELEASE_TAG"

  build:
    needs: [verify-homebrew-token, validate]
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: coval-linux-x64
            binary: coval
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: coval-linux-arm64
            binary: coval
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: coval-macos-x64
            binary: coval
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: coval-macos-arm64
            binary: coval
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: coval-windows-x64
            binary: coval.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../${{ matrix.artifact }}.tar.gz ${{ matrix.binary }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          for dir in */; do
            (cd "$dir" && sha256sum -- *.tar.gz > SHA256SUMS)
          done
          cat -- */SHA256SUMS > ../SHA256SUMS

      - name: Create or update release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.RELEASE_REF }}
          files: |
            artifacts/*/*.tar.gz
            SHA256SUMS
          generate_release_notes: true

  update-homebrew:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tap_pr_url: ${{ steps.tap.outputs.pr_url }}

    steps:
      # This job holds HOMEBREW_TAP_TOKEN, so it runs the formula renderer from
      # the workflow's own ref (main, or the pushed tag), never RELEASE_REF.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download SHA256SUMS from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS

      - name: Parse checksums
        id: sha
        run: |
          {
            echo "macos_arm64=$(grep 'coval-macos-arm64' SHA256SUMS | awk '{print $1}')"
            echo "macos_x64=$(grep 'coval-macos-x64' SHA256SUMS | awk '{print $1}')"
            echo "linux_arm64=$(grep 'coval-linux-arm64' SHA256SUMS | awk '{print $1}')"
            echo "linux_x64=$(grep 'coval-linux-x64' SHA256SUMS | awk '{print $1}')"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update the Homebrew tap pull request
        id: tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ env.RELEASE_TAG }}
          SHA_MACOS_ARM64: ${{ steps.sha.outputs.macos_arm64 }}
          SHA_MACOS_X64: ${{ steps.sha.outputs.macos_x64 }}
          SHA_LINUX_ARM64: ${{ steps.sha.outputs.linux_arm64 }}
          SHA_LINUX_X64: ${{ steps.sha.outputs.linux_x64 }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not configured."
            exit 1
          fi

          # The tap's rulesets reject direct pushes to main, so the release
          # pushes its own branch and opens a pull request for review.
          tap_repo="coval-ai/homebrew-tap"
          branch="release/coval-${VERSION}"
          title="chore: update coval to ${VERSION#v}"
          body_file="${RUNNER_TEMP}/homebrew-tap-pr-body.md"
          tap_dir="${RUNNER_TEMP}/homebrew-tap"
          auth_header="Authorization: Basic $(printf 'x-access-token:%s' "$HOMEBREW_TAP_TOKEN" | base64 | tr -d '\n')"
          git_auth() {
            GIT_CONFIG_COUNT=1 \
              GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
              GIT_CONFIG_VALUE_0="$auth_header" \
              git "$@"
          }

          git_auth clone --branch main "https://github.com/${tap_repo}.git" "$tap_dir"
          mkdir -p "$tap_dir/Formula"
          python scripts/render_homebrew_formula.py \
            --version "${VERSION#v}" \
            --macos-arm64 "$SHA_MACOS_ARM64" \
            --macos-x64 "$SHA_MACOS_X64" \
            --linux-arm64 "$SHA_LINUX_ARM64" \
            --linux-x64 "$SHA_LINUX_X64" \
            --output "$tap_dir/Formula/coval.rb" \
            --pull-request-body "$body_file" \
            --run-url "$RUN_URL"

          if [ -z "$(git -C "$tap_dir" status --porcelain -- Formula/coval.rb)" ]; then
            echo "Homebrew formula already matches ${VERSION}; nothing to push."
            exit 0
          fi

          # A rerun reuses the release branch when it already carries this
          # formula. Rebuilt release assets change the checksums, so the branch
          # is then replaced with a fresh commit on main.
          remote_sha="$(git_auth -C "$tap_dir" ls-remote origin "refs/heads/${branch}" | cut -f1)"
          if [ -n "$remote_sha" ] \
            && git_auth -C "$tap_dir" fetch --quiet origin "refs/heads/${branch}" \
            && git -C "$tap_dir" diff --quiet FETCH_HEAD -- Formula/coval.rb; then
            echo "${branch} already carries the ${VERSION} formula."
          else
            git -C "$tap_dir" switch --create "$branch"
            git -C "$tap_dir" config user.name "github-actions[bot]"
            git -C "$tap_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$tap_dir" add Formula/coval.rb
            git -C "$tap_dir" commit -m "$title"
            git_auth -C "$tap_dir" push \
              --force-with-lease="refs/heads/${branch}:${remote_sha}" \
              origin "HEAD:refs/heads/${branch}"
          fi

          export GH_TOKEN="$HOMEBREW_TAP_TOKEN"
          pr_number="$(
            gh api "repos/${tap_repo}/pulls?head=coval-ai:${branch}&base=main&state=open" \
              --jq '.[0].number // empty'
          )"
          if [ -n "$pr_number" ]; then
            pr_url="$(
              gh api --method PATCH "repos/${tap_repo}/pulls/${pr_number}" \
                -f title="$title" \
                -F body=@"$body_file" \
                --jq '.html_url'
            )"
            echo "Updated ${pr_url}."
          else
            pr_url="$(
              gh api --method POST "repos/${tap_repo}/pulls" \
                -f title="$title" \
                -f head="$branch" \
                -f base=main \
                -F body=@"$body_file" \
                --jq '.html_url'
            )"
            echo "Opened ${pr_url}."
          fi
          echo "pr_url=${pr_url}" >> "$GITHUB_OUTPUT"
          echo "Homebrew picks up ${VERSION} once ${pr_url} merges." >> "$GITHUB_STEP_SUMMARY"

  report-failure:
    needs: [verify-homebrew-token, validate, build, release, update-homebrew]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the release failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'CLI release workflow is failing';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Release \`${process.env.RELEASE_TAG}\` failed: ${runUrl}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

  close-recovered-failure:
    needs: [verify-homebrew-token, validate, build, release, update-homebrew]
    if: ${{ always() && needs.update-homebrew.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close a recovered release failure issue
        uses: actions/github-script@v7
        env:
          TAP_PR_URL: ${{ needs.update-homebrew.outputs.tap_pr_url }}
        with:
          script: |
            const title = 'CLI release workflow is failing';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const prUrl = process.env.TAP_PR_URL;
            const body = prUrl
              ? `Recovered in ${runUrl}. Homebrew picks up \`${process.env.RELEASE_TAG}\` once ${prUrl} merges.`
              : `Recovered in ${runUrl}.`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }
