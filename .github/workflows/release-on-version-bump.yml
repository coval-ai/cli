name: Release on version bump

# Wait for the exact main-branch CI run to pass, then release an untagged Cargo
# version. The release workflow is called directly because a tag pushed with
# GITHUB_TOKEN does not trigger another workflow.
#
# The commit's version is read with a read-only token. The job that can write
# tags never checks out or runs repository code.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-on-version-bump
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_candidate: ${{ steps.version.outputs.release_candidate }}
      sha: ${{ steps.ref.outputs.sha }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Resolve the CI-tested commit
        id: ref
        env:
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF_NAME" != "main" ]; then
              echo "::error::Manual releases must be dispatched from main (got $GITHUB_REF_NAME)."
              exit 1
            fi
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$WORKFLOW_RUN_SHA" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.ref.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read and validate the release version
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            python scripts/release_version.py --github-output "$GITHUB_OUTPUT"
          else
            python scripts/release_version.py \
              --allow-non-release \
              --github-output "$GITHUB_OUTPUT"
          fi

  tag:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release: ${{ steps.tag.outputs.release }}
      release_ref: ${{ steps.tag.outputs.release_ref }}
    steps:
      - name: Tag an unreleased version
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CANDIDATE: ${{ needs.prepare.outputs.release_candidate }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_CANDIDATE" != "true" ]; then
            echo "Cargo.toml does not contain a stable release candidate; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # matching-refs is a prefix search, so keep only the exact tag.
          tag_refs="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${RELEASE_TAG}" \
              --jq "map(select(.ref == \"refs/tags/${RELEASE_TAG}\")) | length"
          )"
          if [ "$tag_refs" != "0" ]; then
            existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/refs/tags/${RELEASE_TAG}" --jq '.sha')"
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "Manual recovery will rerun the existing ${RELEASE_TAG} release."
              echo "release=true" >> "$GITHUB_OUTPUT"
              echo "release_ref=$existing_sha" >> "$GITHUB_OUTPUT"
            else
              echo "${RELEASE_TAG} is already released; nothing to do."
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "release_ref=$existing_sha" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          tag_object="$(
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/tags" \
              -f tag="$RELEASE_TAG" \
              -f message="$RELEASE_TAG" \
              -f object="$RELEASE_SHA" \
              -f type=commit \
              --jq '.sha'
          )"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${RELEASE_TAG}" \
            -f sha="$tag_object" \
            --silent
          echo "Tagged ${RELEASE_SHA} as ${RELEASE_TAG}."
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "release_ref=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

  release:
    needs: [prepare, tag]
    if: needs.tag.outputs.release == 'true'
    permissions:
      contents: write
      issues: write
    uses: ./.github/workflows/release.yml
    with:
      release_ref: ${{ needs.tag.outputs.release_ref }}
      tag_name: ${{ needs.prepare.outputs.tag }}
    secrets: inherit
