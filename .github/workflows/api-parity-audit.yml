name: Weekly API parity audit

# The scheduled Codex job does the judgment-heavy command implementation and
# opens a reviewed PR. This workflow is the deterministic backstop: it runs the
# same live audit without credentials and keeps one GitHub issue open whenever
# the public API and first-class CLI command surface drift.

on:
  workflow_dispatch:
  schedule:
    # Monday 10:00 UTC, after the SDK regeneration job.
    - cron: "0 10 * * 1"

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly-api-parity-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-audit.txt

      - name: Install pinned dependencies
        run: python -m pip install --requirement scripts/requirements-audit.txt

      - name: Test the audit
        run: python -m unittest scripts/test_audit_api_coverage.py

      - name: Compare first-class commands with the live public API
        run: python scripts/audit_api_coverage.py

      - name: Open or update the parity failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Weekly CLI API parity audit is failing';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The scheduled CLI API parity audit failed.',
              '',
              `Run: ${runUrl}`,
              '',
              'Until this is reconciled, the first-class CLI command coverage may have drifted from the published API.',
            ].join('\n');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Close a recovered parity failure issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Weekly CLI API parity audit is failing';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Recovered in ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }
