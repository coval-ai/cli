[package]
name = "xtask"
version = "0.0.0"
edition = "2021"
publish = false
description = "Dev tooling for the Coval CLI (OpenAPI → generated model codegen)."

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
openapiv3 = "2.2.0"
progenitor = "0.14.0"
proc-macro2 = "1.0"
quote = "1.0"
serde_yaml = "0.9"
serde_json = "1.0"
syn = { version = "2.0", features = ["full", "parsing", "printing"] }
ureq = { version = "2.10", features = ["json"] }
