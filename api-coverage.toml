# Reviewed against the live public OpenAPI catalog by scripts/audit_api_coverage.py.
# Every published operation must either reach a first-class CLI command or have a reason here,
# every published request-body property on a covered operation must either be declared on
# the Rust request struct the CLI sends or have a reason in the request-field sections below,
# and every published header or query parameter on a covered operation must either be sendable
# by the CLI or have a reason in the parameter sections at the end of this file.
#
# Every known_gap, known_field_gap and known_parameter_gap entry records the date someone last
# reviewed it in reviewed_at. Once a gap is older than gap_review.max_age_days, the audit reports
# ACTION REQUIRED until the gap is implemented or reviewed again with a new reviewed_at date.

[snapshot]
catalog_url = "https://api.coval.dev/v1/openapi"
reviewed_at = "2026-11-06"
published_operations = 199
cli_supported_operations = 125
published_request_fields = 472
cli_modeled_request_fields = 472
published_parameters = 196
cli_supported_parameters = 72

[gap_review]
max_age_days = 120

