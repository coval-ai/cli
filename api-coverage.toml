#
# serde drops any JSON field a request struct does not declare, so a published
# request-body property missing from src/client/models/*.rs is discarded in
# silence. These sections review that layer for operations the CLI already
# implements; a published operation with no CLI command at all is a route gap
# above, not a field gap here.
#
# The published YAML is hand-written rather than generated, so it can be wrong in
# either direction. Before modeling a field, cross-check it against the served
# Pydantic model; coval-ai/backend records the known divergence in
# src/services/api/tests/v1/openapi_parity_baseline.txt.

