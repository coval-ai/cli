# Reviewed against the live public OpenAPI catalog by scripts/audit_api_coverage.py.
# Every published operation must either reach a first-class CLI command or have a reason here,
# and every published request-body property on a covered operation must either be declared on
# the Rust request struct the CLI sends or have a reason in the request-field sections below.

[snapshot]
catalog_url = "https://api.coval.dev/v1/openapi"
reviewed_at = "2026-09-03"
published_operations = 181
cli_supported_operations = 119
published_request_fields = 360
cli_modeled_request_fields = 313

