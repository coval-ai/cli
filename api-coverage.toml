# =============================================================================
# REQUEST FIELDS
# =============================================================================
#
# serde drops any JSON field a request struct does not declare, so a published
# request-body property missing from src/client/models/*.rs is discarded in
# silence. These sections review that layer for operations the CLI already
# implements; a published operation with no CLI command at all is a route gap
# above, not a field gap here.
#
# The published YAML is hand-written rather than generated, so it can be wrong in
# either direction. Before modeling a field, cross-check it against the served
# Pydantic model; coval-ai/backend records the known divergence in
# src/services/api/tests/v1/openapi_parity_baseline.txt.

# Fields the CLI sends that the published schema does not declare. Most are served
# but undocumented, so removing them from the CLI would lose working behavior.

[[allowed_extra_field]]
operation = "PATCH /conversations/uploaded/{conversation_id}"
field = "audio_reference"
reason = "Served but deliberately hidden from the published schema as an internal field; the API still accepts it."

[[allowed_extra_field]]
operation = "PATCH /review-annotations/{annotation_id}"
field = "completion_status"
reason = "Advertised by the CLI but absent from the served contract, which ignores unknown fields, so the flag silently does nothing. Tracked under COVAL-5824."

[[allowed_extra_field]]
operation = "PATCH /review-annotations/{annotation_id}"
field = "status"
reason = "Advertised by the CLI but absent from the served contract, which ignores unknown fields, so the flag silently does nothing. Tracked under COVAL-5824."

